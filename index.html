<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Dark mode flash prevention — runs before any paint -->
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- SEO -->
    <title>Ahmad Al Ghoul — Senior Software Engineer</title>
    <meta name="description" content="Ahmad Al Ghoul — Senior Software Engineer specializing in enterprise and mission-critical systems across government and telecommunications sectors." />
    <meta name="author" content="Ahmad Al Ghoul" />
    <link rel="canonical" href="https://ahmadalghoul.com" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ahmad Al Ghoul — Senior Software Engineer" />
    <meta property="og:description" content="13+ years building enterprise and mission-critical systems. Border management, ERP, cloud infrastructure." />
    <meta property="og:image" content="https://ahmadalghoul.com/AhmadAlghoul-Photo.jpg" />
    <meta property="og:url" content="https://ahmadalghoul.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ahmad Al Ghoul — Senior Software Engineer" />
    <meta name="twitter:description" content="13+ years building enterprise and mission-critical systems." />
    <meta name="twitter:image" content="https://ahmadalghoul.com/AhmadAlghoul-Photo.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvas text-primary font-sans antialiased selection:bg-accent selection:text-white">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
